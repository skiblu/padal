{%- assign current_lang = page.lang | default: site.lang | default: 'ta' -%}
{%- if include.lang and include.lang == current_lang -%}
  {%- if include.html -%}
    {{ include.html }}
  {%- else -%}
    {%- if include.text -%}
      {{ include.text | markdownify }}
    {%- endif -%}
  {%- endif -%}
{%- endif -%}
